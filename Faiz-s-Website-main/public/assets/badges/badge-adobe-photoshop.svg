<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect width="400" height="250" rx="20" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="10" y="10" width="380" height="230" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Watermark Shield / Emblem -->
  <path d="M 330 60 L 370 75 L 370 140 Q 370 190 330 215 Q 290 190 290 140 L 290 75 Z" fill="rgba(255,255,255,0.03)" />

  <!-- Issuer Header Pill -->
  <rect x="25" y="24" width="120" height="26" rx="13" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="85" y="41" fill="#f8fafc" font-size="11" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1">ADOBE</text>

  <!-- Verified Stamp Pill -->
  <rect x="270" y="24" width="105" height="26" rx="13" fill="rgba(20,184,166,0.18)" stroke="#14b8a6" stroke-width="1.2"/>
  <circle cx="286" cy="37" r="4.5" fill="#14b8a6" />
  <text x="325" y="41" fill="#2dd4bf" font-size="10.5" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1">VERIFIED</text>

  <!-- Icon Circle -->
  <g transform="translate(25, 75)">
    <circle cx="36" cy="36" r="34" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="36" cy="36" r="28" fill="#2563eb" opacity="0.75" />
    <text x="36" y="45" font-size="28" text-anchor="middle" fill="#fff">🖼️</text>
  </g>

  <!-- Title & Credentials -->
  <text x="110" y="98" fill="#f8fafc" font-size="15" font-weight="800" font-family="system-ui, sans-serif" width="260">
    <tspan x="110" dy="0">Adobe Certified: Photoshop</tspan>
    <tspan x="110" dy="20" font-size="12" font-weight="600" fill="#94a3b8">Faiz Ni'matul Haq</tspan>
  </text>

  <!-- Footer security row -->
  <line x1="25" y1="185" x2="375" y2="185" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="25" y="212" fill="#64748b" font-size="10" font-family="monospace">CREDENTIAL ID: <tspan fill="#38bdf8">yL6A-uTMp</tspan></text>
  <text x="375" y="212" fill="#14b8a6" font-size="10" font-family="monospace" text-anchor="end" font-weight="600">OFFICIAL RECORD</text>
</svg>